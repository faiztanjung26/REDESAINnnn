{# Jadwal pemeliharaan (FullCalendar). Inisialisasi di dashboard.html. Warna event dari token, lihat skrip di sana. #}
<section class="jt-panel h-100" aria-labelledby="wt-{{ wkey }}">
  <div class="jt-panel-head">
    <h2 class="jt-panel-title" id="wt-{{ wkey }}"><i class="bi bi-calendar-event" aria-hidden="true"></i>Jadwal pemeliharaan</h2>
  </div>
  <div class="jt-panel-body jt-cal">
    <div id="calendar"><div class="jt-skel jt-cal-skel" aria-hidden="true"></div></div>
  </div>
  <div class="jt-panel-foot">
    <ul class="jt-legend jt-legend--inline" aria-label="Keterangan warna status">
      <li class="tone-mute"><span class="jt-dot" aria-hidden="true"></span>Draft</li>
      <li class="tone-violet"><span class="jt-dot" aria-hidden="true"></span>Assigned</li>
      <li class="tone-info"><span class="jt-dot" aria-hidden="true"></span>In Progress</li>
      <li class="tone-warn"><span class="jt-dot" aria-hidden="true"></span>Hold</li>
      <li class="tone-brand"><span class="jt-dot" aria-hidden="true"></span>Solved</li>
      <li class="tone-ok"><span class="jt-dot" aria-hidden="true"></span>Completed</li>
      <li class="tone-orange"><span class="jt-dot" aria-hidden="true"></span>Incompleted</li>
      <li class="tone-bad"><span class="jt-dot" aria-hidden="true"></span>Terlambat</li>
    </ul>
  </div>
</section>
