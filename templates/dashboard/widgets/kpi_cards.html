<!-- KPI Cards Widget: MTBF, MTTR, PM Compliance, Asset Availability -->
<div class="row g-3">
    <!-- MTBF -->
    <div class="col-md-3 col-6">
        <div class="card h-100" title="{{ mtbf_tooltip }}" data-bs-toggle="tooltip" data-bs-placement="bottom">
            <div class="stat">
                <div class="stat-label">MTBF (Hours)</div>
                <div class="stat-row">
                    <div class="stat-value">{{ mtbf_hours }}</div>
                    <span class="stat-icon is-ok d-none d-sm-inline-flex"><i class="bi bi-activity"></i></span>
                </div>
                <div class="stat-note is-ok"><i class="bi bi-arrow-up-circle"></i> Avg. uptime</div>
            </div>
        </div>
    </div>
    <!-- MTTR -->
    <div class="col-md-3 col-6">
        <div class="card h-100" title="{{ mttr_tooltip }}" data-bs-toggle="tooltip" data-bs-placement="bottom">
            <div class="stat">
                <div class="stat-label">MTTR (Hours)</div>
                <div class="stat-row">
                    <div class="stat-value">{{ mttr_hours }}</div>
                    <span class="stat-icon is-brand d-none d-sm-inline-flex"><i class="bi bi-wrench-adjustable"></i></span>
                </div>
                <div class="stat-note is-brand"><i class="bi bi-tools"></i> Avg. repair time</div>
            </div>
        </div>
    </div>
    <!-- PM Compliance -->
    <div class="col-md-3 col-6">
        <div class="card h-100">
            <div class="stat">
                <div class="stat-label">PM Compliance</div>
                <div class="stat-row">
                    <div class="stat-value">{{ pm_compliance }}%</div>
                    <span class="stat-icon is-info d-none d-sm-inline-flex"><i class="bi bi-check2-all"></i></span>
                </div>
                <div class="stat-note is-info"><i class="bi bi-calendar-check"></i> On-time tasks</div>
            </div>
        </div>
    </div>
    <!-- Availability -->
    <div class="col-md-3 col-6">
        <div class="card h-100">
            <div class="stat">
                <div class="stat-label">Availability</div>
                <div class="stat-row">
                    <div class="stat-value">{{ asset_availability }}%</div>
                    <span class="stat-icon is-warn d-none d-sm-inline-flex"><i class="bi bi-server"></i></span>
                </div>
                <div class="stat-note is-warn"><i class="bi bi-hdd-network"></i> Online / Total</div>
            </div>
        </div>
    </div>
</div>
