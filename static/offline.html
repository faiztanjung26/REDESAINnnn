<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode Offline - Portal Engineer</title>
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
        .offline-card { background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1.25rem; max-width: 480px; width: 100%; text-align: center; padding: 2.5rem 1.5rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); backdrop-filter: blur(16px); }
        .offline-icon { font-size: 3.5rem; color: #f59e0b; margin-bottom: 1rem; }
        .btn-offline { background: #2563eb; color: white; border-radius: 0.75rem; padding: 0.75rem 1.5rem; font-weight: 600; text-decoration: none; display: inline-block; margin-top: 1rem; transition: background 0.2s; }
        .btn-offline:hover { background: #1d4ed8; color: white; }
    </style>
</head>
<body>
    <div class="offline-card">
        <i class="bi bi-wifi-off offline-icon"></i>
        <h3 class="fw-bold mb-2">Anda Sedang Offline</h3>
        <p class="text-muted small mb-4">Halaman ini belum pernah tersimpan di cache lokal HP Anda. Anda tetap dapat mengakses halaman <strong>Work Orders</strong> dan halaman lain yang telah dikunjungi sebelumnya secara offline.</p>
        <div class="d-grid gap-2">
            <a href="/work-orders/" class="btn-offline"><i class="bi bi-list-task me-1"></i> Buka Work Orders Offline</a>
            <button onclick="window.location.reload()" class="btn btn-outline-light rounded-3 py-2 mt-1 small"><i class="bi bi-arrow-clockwise me-1"></i> Coba Muat Ulang</button>
        </div>
    </div>
</body>
</html>
